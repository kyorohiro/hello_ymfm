<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YM2612 Synth Keyboard Demo</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4efe4;
        --panel: #fffaf0;
        --ink: #1f1b16;
        --accent: #b4572f;
        --accent-dark: #7e381c;
        --line: #d7c8ac;
        --code: #2b241d;
        --code-ink: #f6ead7;
        --pill-bg: #343a4a;
        --pill-border: #6e7a92;
        --pill-ink: #f7f3ea;
        --pill-muted: #bfc9db;
      }

      * {
        box-sizing: border-box;
      }

      html {
        overflow-x: hidden;
        overflow-y: auto;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, #fff8df 0, transparent 28%),
          radial-gradient(circle at bottom right, #f0d8ba 0, transparent 24%),
          linear-gradient(160deg, var(--bg), #eadfc9 60%, #e0cfb5);
      }

      main {
        max-width: 1240px;
        margin: 0 auto;
        padding: 28px 16px 40px;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 90%, white 10%);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 18px 40px rgba(90, 62, 30, 0.12);
      }

      h1,
      h2 {
        margin: 0 0 12px;
        line-height: 1.1;
        letter-spacing: -0.04em;
      }

      h1 {
        font-size: clamp(2rem, 4vw, 3rem);
      }

      h2 {
        margin-top: 0;
        font-size: 1rem;
      }

      .topline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }

      .meta {
        margin: 0;
        font-size: 0.9rem;
      }

      .meta a {
        color: inherit;
      }

      .status {
        margin: 10px 0 16px;
        min-height: 1.5em;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
        align-items: start;
      }

      .controls-stack {
        display: grid;
        gap: 14px;
      }

      .control-section,
      .card {
        padding: 14px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.36);
      }

      .preset-row {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }

      .preset-row label {
        font-size: 0.68rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .preset-row select {
        min-width: 156px;
        max-width: 220px;
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        font: inherit;
        font-size: 0.78rem;
        line-height: 1.2;
      }

      .operator-stack {
        display: grid;
        gap: 10px;
      }

      .operator-header-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 6px;
        align-items: end;
      }

      .operator-header-spacer {
        min-width: 0;
      }

      .operator-header-strip {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
      }

      .operator-header-cell {
        min-width: 0;
        text-align: center;
        font-size: 0.48rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: rgba(31, 27, 22, 0.64);
        text-transform: uppercase;
      }

      .operator-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        gap: 6px;
        align-items: center;
      }

      .operator-name {
        font-size: 0.72rem;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        min-width: 0;
      }

      .operator-name.op-color-1,
      .operator-name.op-color-2,
      .operator-name.op-color-3,
      .operator-name.op-color-4 {
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .param-strip {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
      }

      #operatorControls .param-strip {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 4px;
        overflow: visible;
      }

      .param-control {
        display: grid;
        grid-template-columns: auto auto auto auto;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
        min-width: 82px;
        padding: 2px 5px 2px 7px;
        border-radius: 999px;
        border: 1.5px solid var(--pill-border);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0) 45%),
          var(--pill-bg);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 1px 5px rgba(30, 24, 18, 0.14);
      }

      .param-control.no-label {
        grid-template-columns: 16px minmax(0, 1fr) 16px;
        justify-items: center;
        gap: 4px;
        padding: 2px 6px;
      }

      #operatorControls .param-control {
        min-width: 0;
        width: 100%;
      }

      #operatorControls .param-control.no-label {
        grid-template-columns: 12px minmax(0, 1fr) 12px;
        justify-items: center;
        gap: 2px;
        padding: 2px 4px;
      }

      .param-label {
        min-width: 14px;
        font-size: 0.48rem;
        font-weight: 800;
        letter-spacing: 0.06em;
        text-align: left;
        color: var(--pill-muted);
      }

      .param-button,
      .param-value {
        font: inherit;
      }

      .param-button {
        width: 16px;
        height: 16px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--pill-ink);
        cursor: pointer;
        font-size: 0.92rem;
        line-height: 1;
      }

      .param-button:hover {
        color: white;
      }

      .param-value {
        min-width: 20px;
        padding: 0;
        border: 0;
        background: transparent;
        text-align: center;
        color: var(--pill-ink);
        font-size: 0.6rem;
        font-weight: 800;
        letter-spacing: 0.02em;
        user-select: none;
        cursor: ew-resize;
      }

      .param-value.is-dragging {
        color: #ffe3b6;
      }

      .keyboard {
        display: grid;
        gap: clamp(4px, 1vw, 8px);
        overflow-x: hidden;
      }

      .keyboard-wrap {
        position: relative;
      }

      .keyboard.is-loading {
        opacity: 0.38;
        pointer-events: none;
        filter: saturate(0.75);
      }

      .prepare-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        border-radius: 16px;
        background: rgba(244, 239, 228, 0.82);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity 120ms ease;
      }

      .prepare-overlay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .prepare-popup {
        min-width: min(280px, 92%);
        padding: 14px 18px;
        border-radius: 18px;
        border: 1px solid rgba(180, 87, 47, 0.24);
        background: rgba(255, 250, 240, 0.96);
        box-shadow: 0 18px 40px rgba(90, 62, 30, 0.16);
        text-align: center;
      }

      .prepare-popup strong {
        display: block;
        font-size: 1rem;
        letter-spacing: -0.02em;
      }

      .prepare-popup span {
        display: block;
        margin-top: 6px;
        font-size: 0.82rem;
        line-height: 1.4;
        color: rgba(31, 27, 22, 0.76);
      }

      .visual-card {
        padding: 12px;
      }

      .visual-card h2 {
        margin-bottom: 8px;
      }

      .visual-card p {
        margin: 0 0 10px;
        font-size: 0.82rem;
        line-height: 1.45;
      }

      .algo-inline {
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
      }

      .op-color-1 {
        color: #f2c078;
        font-weight: 800;
      }

      .op-color-2 {
        color: #ff93bc;
        font-weight: 800;
      }

      .op-color-3 {
        color: #9dff9b;
        font-weight: 800;
      }

      .op-color-4 {
        color: #89b7ff;
        font-weight: 800;
      }

      canvas {
        display: block;
        width: 100%;
        height: 220px;
        border-radius: 14px;
        background: #241d16;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .key-row {
        display: grid;
        gap: clamp(4px, 1vw, 8px);
      }

      .key-row[data-count="10"] {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .key-row[data-count="9"] {
        grid-template-columns: repeat(9, minmax(0, 1fr));
      }

      .key-row[data-count="7"] {
        grid-template-columns: repeat(7, minmax(0, 1fr));
      }

      .key {
        appearance: none;
        border: 1px solid var(--line);
        border-radius: clamp(8px, 1.6vw, 14px);
        padding: clamp(5px, 1.2vw, 10px) clamp(4px, 1vw, 8px);
        text-align: left;
        background: rgba(255, 255, 255, 0.52);
        color: var(--ink);
        cursor: pointer;
        min-width: 0;
      }

      .key:hover {
        border-color: var(--accent);
      }

      .key.is-active {
        background: linear-gradient(135deg, #f0c58a, #df8e4f);
        border-color: #b4572f;
        color: #2b241d;
      }

      .key strong,
      .key span,
      .key small {
        display: block;
      }

      .key strong {
        font-size: clamp(0.72rem, 1.8vw, 1rem);
        line-height: 1;
      }

      .key span {
        margin-top: clamp(2px, 0.5vw, 4px);
        font-size: clamp(0.62rem, 1.5vw, 0.84rem);
        font-weight: 700;
      }

      .key small {
        margin-top: clamp(2px, 0.5vw, 4px);
        font-size: clamp(0.54rem, 1.2vw, 0.72rem);
        opacity: 0.82;
      }

      pre {
        margin: 0;
        padding: 14px 16px;
        border-radius: 14px;
        background: var(--code);
        color: var(--code-ink);
        font-family: "SFMono-Regular", Menlo, Consolas, monospace;
        font-size: 0.82rem;
        overflow-x: auto;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 760px) {
        .operator-header-row {
          grid-template-columns: 36px minmax(0, 1fr);
          gap: 4px;
        }

        .operator-header-strip {
          gap: 3px;
        }

        .operator-header-cell {
          font-size: 0.42rem;
        }

        .operator-row {
          grid-template-columns: 36px minmax(0, 1fr);
          gap: 4px;
        }

        .operator-name {
          font-size: 0.62rem;
        }

        .param-strip {
          gap: 4px;
        }

        #operatorControls .param-strip {
          gap: 3px;
        }

        .param-control {
          min-width: 70px;
          padding: 1px 4px 1px 5px;
        }

        .param-control.no-label {
          grid-template-columns: 14px minmax(0, 1fr) 14px;
          padding: 1px 4px;
        }

        #operatorControls .param-control {
          min-width: 0;
        }

        #operatorControls .param-control.no-label {
          padding: 1px 3px;
          grid-template-columns: 10px minmax(0, 1fr) 10px;
        }

        .param-label {
          min-width: 12px;
          font-size: 0.42rem;
        }

        .param-button {
          width: 14px;
          height: 14px;
          font-size: 0.8rem;
        }

        .param-value {
          min-width: 16px;
          font-size: 0.54rem;
        }

        .key {
          padding: 4px 3px;
        }

        .key strong {
          font-size: 0.62rem;
        }

        .key span {
          font-size: 0.54rem;
        }

        .key small {
          font-size: 0.46rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="panel">
        <div class="topline">
        </div>
        <div class="layout">
          <section class="controls-stack">
            <div class="card visual-card">
              <h2>Envelope / Output</h2>
              <p id="envelopeDescription"></p>
              <canvas id="envelopeCanvas" width="720" height="220"></canvas>
            </div>

            <div class="control-section">
              <h2>YM2612 Knobs</h2>
              <div class="preset-row">
                <label for="presetSelect">Preset</label>
                <select id="presetSelect"></select>
              </div>
              <div class="operator-stack">
                <div class="operator-header-row">
                  <div class="operator-header-spacer"></div>
                  <div class="operator-header-strip" id="commonHeader"></div>
                </div>
                <div class="operator-row">
                  <div class="operator-name">Common</div>
                  <div class="param-strip" id="commonControls"></div>
                </div>
                <div class="operator-header-row">
                  <div class="operator-header-spacer"></div>
                  <div class="operator-header-strip" id="operatorHeader"></div>
                </div>
                <div id="operatorControls" class="operator-stack"></div>
              </div>
            </div>
        <div class="status" id="status">Press any key or click a pad to start audio.</div>

            <div class="control-section">
              <h2>Keyboard</h2>
              <div class="keyboard-wrap">
                <div class="keyboard" id="keyboard"></div>
                <div class="prepare-overlay" id="prepareOverlay" aria-live="polite" aria-hidden="true">
                  <div class="prepare-popup">
                    <strong>Preparing audio...</strong>
                    <span>Please wait a moment. The YM2612 worklet and WASM are loading.</span>
                  </div>
                </div>
              </div>
            </div>
          </section>

        </div>
      </section>
    </main>

    <script type="module">
      import "./synth.js";
    </script>
  </body>
</html>
